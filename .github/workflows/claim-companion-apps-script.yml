name: Deploy Claim Companion Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: claim-companion-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.CLAIM_COMPANION_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > claim-companion/apps-script/.clasp.json
      - name: Push Workspace processor
        working-directory: claim-companion/apps-script
        run: npx --yes @google/clasp@3.2.0 push --force
