name: EEV2-001D hook EEV2 extractor into Code.gs

on:
  push:
    branches:
      - eev2-001-structured-cost-extraction
    paths:
      - .github/workflows/eev2-001d-hook-codegs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-codegs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eev2-001-structured-cost-extraction
          fetch-depth: 0

      - name: Insert EEV2 cost hook and null-safe page guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps-script/Code.gs')
          text = path.read_text()
          original = text

          old = '''function extractBoardroomFindings(file, pageOrSheet, text, page) {\n  const findings = [];\n  if (page.headers && page.row) {'''
          new = '''function extractBoardroomFindings(file, pageOrSheet, text, page) {\n  const findings = [];\n  const eev2 = eev2ExtractStructuredFindings(file, pageOrSheet, text);\n  if (eev2 && eev2.document_type === "COST_ESTIMATE") {\n    findings.push(...(eev2.findings || []));\n    return findings;\n  }\n  if (page && page.headers && page.row) {'''

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected extractBoardroomFindings start not found; refusing unsafe patch.')

          if text == original:
              print('Code.gs already contains EEV2 hook; nothing to do.')
          else:
              path.write_text(text)
              print('Inserted EEV2 cost hook safely.')
          PY

      - name: Verify hook markers
        shell: bash
        run: |
          grep -F 'const eev2 = eev2ExtractStructuredFindings(file, pageOrSheet, text);' apps-script/Code.gs
          grep -F 'if (eev2 && eev2.document_type === "COST_ESTIMATE") {' apps-script/Code.gs
          grep -F 'if (page && page.headers && page.row) {' apps-script/Code.gs

      - name: Commit patched Code.gs
        shell: bash
        run: |
          if git diff --quiet -- apps-script/Code.gs; then
            echo 'No Code.gs changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs
          git commit -m 'fix(eev2): wire structured cost extractor into form path'
          git push origin HEAD:eev2-001-structured-cost-extraction
