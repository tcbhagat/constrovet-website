name: Constrovet Evidence Harness CI

on:
  pull_request:
    paths:
      - "apps-script/**"
      - "scripts/run-eev2-harness.mjs"
      - "scripts/check-fixture-provenance.mjs"
      - "tests/eev2-evidence-harness.test.mjs"
      - "tests/check-fixture-provenance.test.mjs"
      - "package.json"
      - ".github/workflows/eev2-harness-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - "scripts/run-eev2-harness.mjs"
      - "scripts/check-fixture-provenance.mjs"
      - "tests/eev2-evidence-harness.test.mjs"
      - "tests/check-fixture-provenance.test.mjs"
      - "package.json"
      - ".github/workflows/eev2-harness-ci.yml"

permissions:
  contents: read

jobs:
  deterministic-evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:fixtures
      - run: npm run test:harness
      - run: node --test tests/eev2-evidence-harness.test.mjs
      - run: node --test tests/check-fixture-provenance.test.mjs
