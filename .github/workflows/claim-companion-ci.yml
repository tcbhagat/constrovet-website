name: Public Site and Claim Companion CI

on:
  pull_request:
    paths:
      - "index.html"
      - "*.html"
      - "app/**"
      - "assets/nav.html"
      - "assets/css/style.css"
      - "assets/**"
      - "blog/**"
      - "boardroom/**"
      - "pages/**"
      - "ssm-core-demo/index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "CNAME"
      - "claim-companion/**"
      - "android/claim-companion/**"
      - "tests/*.test.mjs"
      - "tests/e2e/**"
      - "scripts/check-claim-companion.mjs"
      - "scripts/verify-production-deploy.sh"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - ".github/workflows/claim-companion-ci.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.html"
      - "app/**"
      - "assets/nav.html"
      - "assets/css/style.css"
      - "assets/**"
      - "blog/**"
      - "boardroom/**"
      - "pages/**"
      - "ssm-core-demo/index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "CNAME"
      - "claim-companion/**"
      - "android/claim-companion/**"
      - "tests/*.test.mjs"
      - "tests/e2e/**"
      - "scripts/check-claim-companion.mjs"
      - "scripts/verify-production-deploy.sh"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  android-debug-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle -p android/claim-companion :app:bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: claim-companion-debug-aab
          path: android/claim-companion/app/build/outputs/bundle/debug/app-debug.aab

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
