name: Claim Companion CI

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/nav.html"
      - "assets/footer.html"
      - "assets/css/style.css"
      - "pages/contact.html"
      - "pages/challanse.html"
      - "ssm-core-demo/index.html"
      - "sitemap.xml"
      - "claim-companion/**"
      - "android/claim-companion/**"
      - "tests/claim-companion-public.test.mjs"
      - "tests/construction-public-scope.test.mjs"
      - "scripts/check-claim-companion.mjs"
      - "scripts/verify-production-deploy.sh"
      - "package.json"
      - ".github/workflows/claim-companion-*.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/nav.html"
      - "assets/footer.html"
      - "assets/css/style.css"
      - "pages/contact.html"
      - "pages/challanse.html"
      - "ssm-core-demo/index.html"
      - "sitemap.xml"
      - "claim-companion/**"
      - "android/claim-companion/**"
      - "tests/claim-companion-public.test.mjs"
      - "tests/construction-public-scope.test.mjs"
      - "scripts/check-claim-companion.mjs"
      - "scripts/verify-production-deploy.sh"
      - "package.json"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  android-debug-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle -p android/claim-companion :app:bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: claim-companion-debug-aab
          path: android/claim-companion/app/build/outputs/bundle/debug/app-debug.aab

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
