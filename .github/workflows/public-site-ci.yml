name: Public Site CI

on:
  pull_request:
    paths:
      - "index.html"
      - "*.html"
      - "app/**"
      - "assets/nav.html"
      - "assets/css/style.css"
      - "assets/**"
      - "blog/**"
      - "boardroom/**"
      - "pages/**"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "CNAME"
      - "tests/*.test.mjs"
      - "tests/e2e/**"
      - "scripts/verify-production-deploy.sh"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - ".github/workflows/public-site-ci.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.html"
      - "app/**"
      - "assets/nav.html"
      - "assets/css/style.css"
      - "assets/**"
      - "blog/**"
      - "boardroom/**"
      - "pages/**"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "CNAME"
      - "tests/*.test.mjs"
      - "tests/e2e/**"
      - "scripts/verify-production-deploy.sh"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
