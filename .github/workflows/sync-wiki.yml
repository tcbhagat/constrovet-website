name: Sync Wiki from Repo

on:
  push:
    branches: [main]
    paths:
      - "REPO_MAP.md"
      - "AGENTS.md"
      - "CONTRACTS.md"
      - "PROJECT_MILESTONES.md"
      - "scripts/generate-wiki.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout constrovet-website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: tcbhagat/-llm-wiki-constrovet
          path: llm-wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate wiki
        run: node scripts/generate-wiki.mjs --wiki-path ./llm-wiki

      - name: Commit and push wiki
        working-directory: ./llm-wiki
        run: |
          git config user.name "Claude Code"
          git config user.email "noreply@anthropic.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to wiki."
          else
            git commit -m "Regenerate wiki from constrovet-website source

            Generated by GitHub Actions workflow on push to main.

            Co-Authored-By: Claude Code <noreply@anthropic.com>"
            git push origin main
            echo "Wiki updated successfully."
          fi
