name: EEV2-001C patch downstream Code.gs

on:
  push:
    branches:
      - eev2-001-structured-cost-extraction
    paths:
      - .github/workflows/eev2-001c-patch-codegs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-codegs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eev2-001-structured-cost-extraction
          fetch-depth: 0

      - name: Apply EEV2 downstream recoverability guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps-script/Code.gs')
          text = path.read_text()
          original = text

          old = '''      if (actual > budget && normalized.financial_category === "LEAKAGE_AND_OVERRUN") normalized.amount_inr = recalculated;'''
          new = '''      if (actual > budget && normalized.financial_category === "LEAKAGE_AND_OVERRUN" && normalized.recoverability_guardrail !== "NOT_ESTABLISHED") normalized.amount_inr = recalculated;'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected deterministic verifier assignment was not found; refusing unsafe patch.')

          old = '''    confidence: ["HIGH", "MEDIUM", "LOW"].indexOf((finding || {}).confidence) >= 0 ? finding.confidence : "LOW"\n  };'''
          new = '''    confidence: ["HIGH", "MEDIUM", "LOW"].indexOf((finding || {}).confidence) >= 0 ? finding.confidence : "LOW",\n    exposure_amount_inr: Math.max(0, Number((finding || {}).exposure_amount_inr || 0)),\n    eev2_semantic_classification: String((finding || {}).eev2_semantic_classification || ""),\n    recoverability_guardrail: String((finding || {}).recoverability_guardrail || "")\n  };'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected normalizeFindingForVerification tail was not found; refusing unsafe patch.')

          old = '''function boardroomActionability(item) {\n  if (!item || item.financial_category === "BASELINE_BUDGET" || item.financial_category === "ESG_METRIC") return ACTION_MONITORING_CONTEXT;\n  if (item.financial_category !== "LEAKAGE_AND_OVERRUN") return ACTION_EVIDENCE_FOLLOWUP;\n  if (boardroomHasQuantifiedCostExposure(item) || Number(item.days || 0) > 0) return ACTION_RECOVERABLE;\n  return ACTION_EVIDENCE_FOLLOWUP;\n}\n\nfunction boardroomHasQuantifiedCostExposure(item) {\n  const calculation = item.calculation || {};\n  return Number(item.amount_inr || 0) > 0 || (Number(calculation.budget || 0) > 0 && Number(calculation.actual || 0) > Number(calculation.budget || 0));\n}'''
          new = '''function boardroomActionability(item) {\n  if (!item || item.financial_category === "BASELINE_BUDGET" || item.financial_category === "ESG_METRIC") return ACTION_MONITORING_CONTEXT;\n  if (item.financial_category !== "LEAKAGE_AND_OVERRUN") return ACTION_EVIDENCE_FOLLOWUP;\n  if (item.recoverability_guardrail === "NOT_ESTABLISHED") return ACTION_EVIDENCE_FOLLOWUP;\n  if (boardroomHasQuantifiedCostExposure(item) || Number(item.days || 0) > 0) return ACTION_RECOVERABLE;\n  return ACTION_EVIDENCE_FOLLOWUP;\n}\n\nfunction boardroomHasQuantifiedCostExposure(item) {\n  if (!item || item.recoverability_guardrail === "NOT_ESTABLISHED") return false;\n  const calculation = item.calculation || {};\n  return Number(item.amount_inr || 0) > 0 || (Number(calculation.budget || 0) > 0 && Number(calculation.actual || 0) > Number(calculation.budget || 0));\n}'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected actionability/exposure functions were not found; refusing unsafe patch.')

          old = '''function boardroomRecoverability(item) {\n  if (item.financial_category !== "LEAKAGE_AND_OVERRUN") return "LOW";\n  if (item.amount_inr > 0 && item.confidence === "HIGH") return "HIGH";\n  if (item.amount_inr > 0 || item.days > 0) return "MEDIUM";\n  return "UNKNOWN";\n}'''
          new = '''function boardroomRecoverability(item) {\n  if (item.financial_category !== "LEAKAGE_AND_OVERRUN") return "LOW";\n  if (item.recoverability_guardrail === "NOT_ESTABLISHED") return "UNKNOWN";\n  if (item.amount_inr > 0 && item.confidence === "HIGH") return "HIGH";\n  if (item.amount_inr > 0 || item.days > 0) return "MEDIUM";\n  return "UNKNOWN";\n}'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected boardroomRecoverability function was not found; refusing unsafe patch.')

          if text == original:
              print('Code.gs already contains EEV2-001C downstream patch; nothing to do.')
          else:
              path.write_text(text)
              print('Applied EEV2-001C downstream patch safely.')
          PY

      - name: Verify patch markers
        shell: bash
        run: |
          grep -F 'normalized.recoverability_guardrail !== "NOT_ESTABLISHED"' apps-script/Code.gs
          grep -F 'exposure_amount_inr: Math.max(0, Number((finding || {}).exposure_amount_inr || 0))' apps-script/Code.gs
          grep -F 'if (item.recoverability_guardrail === "NOT_ESTABLISHED") return ACTION_EVIDENCE_FOLLOWUP;' apps-script/Code.gs
          grep -F 'if (!item || item.recoverability_guardrail === "NOT_ESTABLISHED") return false;' apps-script/Code.gs
          grep -F 'if (item.recoverability_guardrail === "NOT_ESTABLISHED") return "UNKNOWN";' apps-script/Code.gs

      - name: Commit patched Code.gs
        shell: bash
        run: |
          if git diff --quiet -- apps-script/Code.gs; then
            echo 'No Code.gs changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs
          git commit -m 'fix(eev2): preserve exposure semantics downstream'
          git push origin HEAD:eev2-001-structured-cost-extraction
