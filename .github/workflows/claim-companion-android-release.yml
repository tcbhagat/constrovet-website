name: Build Claim Companion Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    environment: claim-companion-play-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/claim-companion.jks"
      - name: Build signed release bundle
        env:
          CC_KEYSTORE_PATH: ${{ runner.temp }}/claim-companion.jks
          CC_KEYSTORE_PASSWORD: ${{ secrets.CC_KEYSTORE_PASSWORD }}
          CC_KEY_ALIAS: ${{ secrets.CC_KEY_ALIAS }}
          CC_KEY_PASSWORD: ${{ secrets.CC_KEY_PASSWORD }}
        run: gradle -p android/claim-companion :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: claim-companion-release-aab
          path: android/claim-companion/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
